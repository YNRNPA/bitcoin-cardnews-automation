name: 비트코인 뉴스 자동화

on:
  schedule:
    - cron: '0 1 * * *'    # 10:00 KST 원고
    - cron: '0 7 * * *'    # 16:00 KST 원고
    - cron: '0 13 * * *'   # 22:00 KST 뉴스만
  workflow_dispatch:
    inputs:
      mode:
        description: 'script = 원고 / news = 뉴스만'
        required: true
        default: 'script'
        type: choice
        options:
          - script
          - news

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests anthropic

      - name: 자동화 실행
        env:
          MODE: ${{ github.event.inputs.mode }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBHOOK_BITCOIN: ${{ secrets.WEBHOOK_BITCOIN }}
          WEBHOOK_STOCK: ${{ secrets.WEBHOOK_STOCK }}
          WEBHOOK_AI: ${{ secrets.WEBHOOK_AI }}
          WEBHOOK_ECONOMY: ${{ secrets.WEBHOOK_ECONOMY }}
        run: python news_automation_test.py

